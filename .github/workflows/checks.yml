name: Comprobar ARCANA
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: arcana-serial-validation
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    # A68 adds 12 isolated projects; A69 adds six serial presentation projects,
    # full opening fixtures and one 30-cycle lifetime sample. No added workers.
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16.9@sha256:ddfe3e8713e3ee5b8f286082cb12512488dfbf3f5a1ecb0b74a42e6055af0a5f
        env:
          POSTGRES_DB: arcana_dev
          POSTGRES_USER: arcana_dev
          POSTGRES_PASSWORD: arcana-local-development
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U arcana_dev -d arcana_dev"
          --health-interval 2s --health-timeout 2s --health-retries 15
      redis:
        image: redis:7-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm run validate:content
      - run: npm test
      - run: npm run test:integration
      - id: build
        run: npm run build
      - run: npm run verify:arcana:build
      - run: npx playwright install --with-deps chromium webkit
      - id: a75phase
        run: node -e "const p=require('./tools/verification/a75-phase.json').phase;if(!['baseline','full'].includes(p))throw Error('Invalid A75 phase');require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'phase='+p+'\\n')"
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ARCANA_CAPTURE_A75=1 npx playwright test --config playwright.experience-a75.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a75-experience-evidence
          path: |
            docs/arcana/experience-fixes-2026-10-17/evidence/linux/**
            test-results/experience-a75/**/error-context.md
          if-no-files-found: ignore
      - if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.a75phase.outputs.phase != 'baseline' }}
        run: ARCANA_CAPTURE_A70=1 npx playwright test --config playwright.boss-a70.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a70-boss-evidence
          path: |
            docs/arcana/boss-increment-2026-10-16/evidence/linux/**
            test-results/boss-a70/**/error-context.md
          if-no-files-found: ignore
      - if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.a75phase.outputs.phase != 'baseline' }}
        run: npx playwright test --config playwright.seasonal-a68.config.ts
      - if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.a75phase.outputs.phase != 'baseline' }}
        # Explicit selected Linux evidence: four images in one Chromium project,
        # never screenshots of the full pack/language/viewport matrix.
        run: ARCANA_CAPTURE_A69=1 npx playwright test --config playwright.motion-a69.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a69-motion-and-seasonal-evidence
          path: |
            docs/arcana/motion-audit-2026-10-16/evidence/linux/**
            test-results/motion-a69/**/error-context.md
            test-results-seasonal-a68/**/error-context.md
          if-no-files-found: ignore
      - if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.a75phase.outputs.phase != 'baseline' }}
        run: ARCANA_TRIAL_COMPILED=1 npm run test:e2e -- --project chromium --project webkit --reporter=line,github
      - if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.a75phase.outputs.phase != 'baseline' }}
        run: npx playwright test --config playwright.progression-a67.config.ts --project chromium-a67 --project webkit-a67
      - if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.a75phase.outputs.phase != 'baseline' }}
        run: npx playwright test --config playwright.gameplay-a63.config.ts
      - if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.a75phase.outputs.phase != 'baseline' }}
        run: npx playwright test --config playwright.header-pact-a66.config.ts
      - if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.a75phase.outputs.phase != 'baseline' }}
        run: npx playwright test --config playwright.intentions-a65.config.ts
      - if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.a75phase.outputs.phase != 'baseline' }}
        run: npm run test:pwa -- --project chromium --project webkit
      - id: reference
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.a75phase.outputs.phase != 'baseline' }}
        run: node tools/verification/build-a66-reference.mjs
      - if: ${{ !cancelled() && steps.reference.outcome == 'success' && steps.a75phase.outputs.phase != 'baseline' }}
        run: A67_PERFORMANCE_VARIANT=baseline npx playwright test --config playwright.performance-a67.config.ts
      - if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.a75phase.outputs.phase != 'baseline' }}
        run: A67_PERFORMANCE_VARIANT=current npx playwright test --config playwright.performance-a67.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a67-validation-evidence
          path: |
            docs/arcana/progression-increment-2026-10-16/evidence/performance/*.json
            test-results-arcana-journey/**/error-context.md
            test-results-progression-a67/**/error-context.md
            test-results-gameplay-a63/**/error-context.md
            test-results-header-pact-a66/**/error-context.md
            test-results-intentions-a65/**/error-context.md
          if-no-files-found: ignore
